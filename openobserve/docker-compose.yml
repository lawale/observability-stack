# OpenObserve Observability Stack
#
# Requires shared/ services to be running first (Caddy, Redis, autolog-service).
# Attaches to the external `observability` network created by shared/.
#
# Services: OpenObserve (logs/metrics/traces/UI), OTEL Collector

networks:
  observability:
    external: true

volumes:
  openobserve-data:

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.14.5
    container_name: openobserve
    restart: unless-stopped
    expose:
      - "5080"
      - "5081"
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-admin@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-changeme}
      - ZO_DATA_DIR=/data
      - ZO_TELEMETRY=false
      - ZO_TRACING_ENABLED=true
      - ZO_TRACING_HEADER_KEY=Authorization
      - ZO_TRACING_HEADER_VALUE=Basic ${ZO_TOKEN:-}
    volumes:
      - openobserve-data:/data
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ==================== OTEL COLLECTOR ====================
  # Primary OTLP ports (4317/4318) — apps send here by default

  otel-collector-openobserve:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: otel-collector-openobserve
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    expose:
      - "8888"
      - "13133"
    networks:
      - observability
    depends_on:
      openobserve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
