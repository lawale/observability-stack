# Docker Compose for Observability Droplet (Multi-Droplet Setup)
#
# This file is optimized for running on a dedicated observability droplet
# that receives telemetry from applications on separate droplets.
#
# Key differences from single-host setup:
# - Services listen on private network interface for remote connections
# - Grafana accessed via Caddy reverse proxy with automatic HTTPS
# - Optimized for network security and performance

version: '3.8'

networks:
  observability:
    driver: bridge

volumes:
  grafana-storage:
  prometheus-storage:
  loki-storage:
  tempo-storage:
  alertmanager-storage:
  redis-autolog:
  caddy-data:
  caddy-config:
  caddy-logs:

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  # ==================== GRAFANA STACK ====================

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,redis-datasource
      - GF_SENTRY_DSN=${GRAFANA_SENTRY_DSN:-}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      # Unified Alerting Configuration
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    user: "nobody"
    expose:
      - "9090"
    # SECURITY NOTE: --web.enable-remote-write-receiver exposes an unauthenticated
    # write endpoint at /api/v1/write. Currently protected by:
    #   1. Port 9090 is NOT exposed publicly (only on internal Docker network)
    #   2. OTEL Collector connects internally via Docker network
    # If you ever expose Prometheus externally, add basic auth via:
    #   --web.config.file=/etc/prometheus/web.yml
    #   web.yml: basic_auth_users: { writer: <bcrypt hash from: htpasswd -nB writer> }
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-4GB}'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-storage:/prometheus
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      - LOKI_RETENTION=${LOKI_RETENTION:-168h}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s|__LOKI_RETENTION__|$$LOKI_RETENTION|g" /etc/loki/loki.yml > /tmp/loki.yml
        exec /usr/bin/loki -config.file=/tmp/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-storage:/loki
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.7.2
    container_name: tempo
    restart: unless-stopped
    user: "10001"
    environment:
      - TEMPO_RETENTION=${TEMPO_RETENTION:-168h}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s|__TEMPO_RETENTION__|$$TEMPO_RETENTION|g" /etc/tempo/tempo.yml > /tmp/tempo-runtime.yml
        exec /tempo -config.file=/tmp/tempo-runtime.yml
    expose:
      - "3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-storage:/tmp/tempo
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Promtail only for observability stack logs
  # Application logs come via OTLP or separate Promtail on app droplets
  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-local.yml:/etc/promtail/promtail.yml
      - caddy-logs:/var/log/caddy:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - observability
    depends_on:
      - loki
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-alerts@localhost}
      - CRITICAL_ALERT_EMAIL=${CRITICAL_ALERT_EMAIL:-critical@localhost}
      - AUTOLOG_WEBHOOK_SECRET=${AUTOLOG_WEBHOOK_SECRET:-}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-storage:/alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|__SMTP_USERNAME__|$$SMTP_USERNAME|g" \
            -e "s|__SMTP_PASSWORD__|$$SMTP_PASSWORD|g" \
            -e "s|__ALERT_EMAIL__|$$ALERT_EMAIL|g" \
            -e "s|__CRITICAL_ALERT_EMAIL__|$$CRITICAL_ALERT_EMAIL|g" \
            -e "s|__AUTOLOG_WEBHOOK_SECRET__|$$AUTOLOG_WEBHOOK_SECRET|g" \
            /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ==================== AUTO-LOGGING SERVICE ====================

  redis-autolog:
    image: redis:7.4-alpine
    container_name: redis-autolog
    restart: unless-stopped
    networks:
      - observability
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  autolog-service:
    build:
      context: ./autolog-service
      dockerfile: Dockerfile
    container_name: autolog-service
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - REDIS_HOST=redis-autolog
      - REDIS_PORT=6379
      - ALERTMANAGER_WEBHOOK_SECRET=${AUTOLOG_WEBHOOK_SECRET}
      - LOG_LEVEL=${AUTOLOG_LOG_LEVEL:-INFO}
      - ERROR_THRESHOLD_COUNT=${ERROR_THRESHOLD_COUNT:-10}
      - ERROR_THRESHOLD_WINDOW_MINUTES=${ERROR_THRESHOLD_WINDOW_MINUTES:-5}
      - AUTOLOG_TTL_MINUTES=${AUTOLOG_TTL_MINUTES:-30}
    networks:
      - observability
    depends_on:
      redis-autolog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ==================== OTEL COLLECTOR ====================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC receiver - apps send telemetry here
      - "4318:4318"   # OTLP HTTP receiver - apps send telemetry here
    expose:
      - "8888"
      - "13133"
    networks:
      - observability
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ==================== CADDY REVERSE PROXY ====================

  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - observability
    depends_on:
      - grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

# ==================== NOTES ====================
#
# Port Binding Strategy:
#
# 1. Public-facing UIs (via Caddy):
#    - Grafana: expose 3000 (Caddy proxies to grafana.yourdomain.com)
#
# 2. Telemetry receivers (from app droplets via VPC):
#    - OTEL Collector gRPC: 0.0.0.0:4317 (apps send here)
#    - OTEL Collector HTTP: 0.0.0.0:4318 (apps send here)
#    - Loki: 0.0.0.0:3100 (if using direct log shipping)
#    - Auto-Log API: 0.0.0.0:5000 (apps query here)
#
# 3. Internal only:
#    - Prometheus: 127.0.0.1:9090
#    - Tempo: 127.0.0.1:3200
#    - AlertManager: 127.0.0.1:9093
#
# For production, replace 0.0.0.0 with your droplet's private IP:
# - "10.0.1.10:4317:4317" instead of "4317:4317"
# - "10.0.1.10:4318:4318" instead of "4318:4318"
# - etc.
#
# This ensures services only listen on the private network interface.
