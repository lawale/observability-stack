receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver for scraping metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  # Batch processor - improves performance
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Memory limiter - prevents OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor - add common attributes
  resource:
    attributes:
      - key: cluster
        value: observability
        action: upsert

  # Attributes processor - enrich telemetry data
  attributes:
    actions:
      - key: environment
        action: upsert
        from_attribute: deployment.environment
      - key: service.name
        action: upsert
        from_attribute: service.name

  # Filter processor - drop telemetry from unknown/unregistered services
  # Drops any telemetry that lacks a service.name resource attribute.
  # All properly instrumented apps set service.name via OTEL SDK.
  filter/known_services:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] == nil'
    metrics:
      metric:
        - 'resource.attributes["service.name"] == nil'
    logs:
      log_record:
        - 'resource.attributes["service.name"] == nil'

  # Resource processor for logs - set resource-level attributes
  resource/logs:
    attributes:
      - key: log.source
        value: otel-collector
        action: upsert

  # Remove high-cardinality resource attributes before converting
  # resources into metric labels for Prometheus remote write.
  resource/metrics_sanitize:
    attributes:
      - key: service.instance.id
        action: delete
      - key: process.pid
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.command_line
        action: delete
      - key: container.id
        action: delete
      - key: k8s.pod.uid
        action: delete
      - key: k8s.pod.name
        action: delete

  # ==================== ADVANCED: Tail Sampling (Optional) ====================
  # Uncomment to sample traces based on error status, latency, or probabilistic rate.
  # Requires the contrib collector image (already in use).
  # Docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/tailsamplingprocessor
  #
  # tail_sampling:
  #   decision_wait: 10s
  #   num_traces: 100
  #   expected_new_traces_per_sec: 10
  #   policies:
  #     - name: errors-policy
  #       type: status_code
  #       status_code:
  #         status_codes: [ERROR]
  #     - name: latency-policy
  #       type: latency
  #       latency:
  #         threshold_ms: 2000
  #     - name: probabilistic-policy
  #       type: probabilistic
  #       probabilistic:
  #         sampling_percentage: 10
  #
  # Add to traces pipeline: [memory_limiter, filter/known_services, tail_sampling, batch, ...]

exporters:
  # Tempo exporter for traces
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki exporter for logs - using native OTLP ingestion (Loki 3.0+)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Prometheus exporter for metrics
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    target_info:
      enabled: true
    add_metric_suffixes: false
    # Convert OTEL resource attributes to metric labels
    # This adds service_name label (service.name becomes service_name)
    resource_to_telemetry_conversion:
      enabled: true
    # Enable exemplars to link metrics -> traces in Grafana
    send_metadata: true

  # Debug exporter - disabled in production to prevent massive log volume
  # Uncomment for debugging only
  # debug:
  #   verbosity: normal
  #   sampling_initial: 5
  #   sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  pprof:
    endpoint: 0.0.0.0:1777

  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/known_services, batch, resource, attributes]
      exporters: [otlp/tempo]

    # Metrics pipeline
    # Note: filter/known_services NOT applied here because the prometheus
    # receiver (self-scrape) produces metrics without service.name attribute.
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource/metrics_sanitize, batch, resource]
      exporters: [prometheusremotewrite]

    # Logs pipeline - using native OTLP ingestion to Loki
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/known_services, batch, resource/logs]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: warn
    metrics:
      level: detailed
      address: 0.0.0.0:8888
