# Grafana Observability Stack
#
# Requires shared/ services to be running first (Caddy, Redis, autolog-service).
# Attaches to the external `observability` network created by shared/.
#
# Services: Grafana, Prometheus, Loki, Tempo, AlertManager, Promtail, OTEL Collector

networks:
  observability:
    external: true

volumes:
  grafana-storage:
  prometheus-storage:
  loki-storage:
  tempo-storage:
  alertmanager-storage:

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GRAFANA_PROMETHEUS_URL=${GRAFANA_PROMETHEUS_URL:-http://prometheus:9090}
      - GRAFANA_LOKI_URL=${GRAFANA_LOKI_URL:-http://loki:3100}
      - GRAFANA_TEMPO_URL=${GRAFANA_TEMPO_URL:-http://tempo:3200}
      - GRAFANA_REDIS_URL=${GRAFANA_REDIS_URL:-redis://redis-autolog:6379}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,redis-datasource
      - GF_SENTRY_DSN=${GRAFANA_SENTRY_DSN:-}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    user: "nobody"
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-4GB}'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-storage:/prometheus
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      - LOKI_RETENTION=${LOKI_RETENTION:-168h}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s|__LOKI_RETENTION__|$$LOKI_RETENTION|g" /etc/loki/loki.yml > /tmp/loki.yml
        exec /usr/bin/loki -config.file=/tmp/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-storage:/loki
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.7.2
    container_name: tempo
    restart: unless-stopped
    user: "10001"
    environment:
      - TEMPO_RETENTION=${TEMPO_RETENTION:-168h}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s|__TEMPO_RETENTION__|$$TEMPO_RETENTION|g" /etc/tempo/tempo.yml > /tmp/tempo-runtime.yml
        exec /tempo -config.file=/tmp/tempo-runtime.yml
    expose:
      - "3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-storage:/tmp/tempo
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-local.yml:/etc/promtail/promtail.yml
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - observability
    depends_on:
      - loki
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    expose:
      - "9093"
    environment:
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-alerts@localhost}
      - CRITICAL_ALERT_EMAIL=${CRITICAL_ALERT_EMAIL:-critical@localhost}
      - AUTOLOG_WEBHOOK_SECRET=${AUTOLOG_WEBHOOK_SECRET:-}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-storage:/alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|__SMTP_USERNAME__|$$SMTP_USERNAME|g" \
            -e "s|__SMTP_PASSWORD__|$$SMTP_PASSWORD|g" \
            -e "s|__ALERT_EMAIL__|$$ALERT_EMAIL|g" \
            -e "s|__CRITICAL_ALERT_EMAIL__|$$CRITICAL_ALERT_EMAIL|g" \
            -e "s|__AUTOLOG_WEBHOOK_SECRET__|$$AUTOLOG_WEBHOOK_SECRET|g" \
            /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ==================== OTEL COLLECTOR ====================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4327:4317"   # OTLP gRPC receiver (host 4327 to avoid clash)
      - "4328:4318"   # OTLP HTTP receiver (host 4328 to avoid clash)
    expose:
      - "8888"
      - "13133"
    networks:
      - observability
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
